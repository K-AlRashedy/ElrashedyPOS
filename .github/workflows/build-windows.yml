name: Build Windows POS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Analyze, test and package
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $base = [regex]::Match((Get-Content pubspec.yaml -Raw), '(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $base = $env:GITHUB_REF_NAME.Substring(1) }
          "name=$base" >> $env:GITHUB_OUTPUT
          "build=$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build release
        run: flutter build windows --release --build-name=${{ steps.version.outputs.name }} --build-number=${{ steps.version.outputs.build }}

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Package installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.name }}" installer\pos.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup exited with $LASTEXITCODE" }

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath "dist\ElrashedyPOS-${{ steps.version.outputs.name }}-windows-portable.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ElrashedyPOS-windows
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ElrashedyPOS-windows
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true