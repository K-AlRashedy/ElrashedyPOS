name: elrashedy_pos
description: "Al Rashedy desktop POS terminal — offline-first cashier client for the Django ERP."
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  http: ^1.2.2
  provider: ^6.1.2
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  uuid: ^4.4.2
  intl: any
  pdf: ^3.11.1
  printing: ^5.13.2
  ffi: ^2.1.3
  package_info_plus: ^8.0.2
  window_manager: ^0.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf